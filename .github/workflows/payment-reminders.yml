name: Unpaid check-in reminders

# Villagers who check in but abandon the Stripe payment flow leave a check-in in
# status 'pending'. This pings the app every 15 minutes so it can email a 1h and
# a 24h reminder (the route is idempotent — it records what it has sent). Also
# exposed as a manual trigger for ad-hoc runs.
#
# Transient 5xx responses (e.g. a Supabase blip) are retried and then treated as
# a skip rather than a failure: the next tick 15 minutes later self-heals, and a
# failed run would only generate a noisy notification email. 401/404 still fail,
# since they mean the secret or route is misconfigured.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production reminders
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "PROD_BASE_URL or CRON_SECRET not set; skipping."
            exit 0
          fi
          for attempt in 1 2 3; do
            response=$(curl -sS -w "\n%{http_code}" -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$BASE_URL/api/cron/payment-reminders") || response=$'\n000'
            body=$(echo "$response" | sed '$d')
            status=$(echo "$response" | tail -n1)
            echo "Attempt $attempt: HTTP $status: $body"
            if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
              exit 0
            fi
            if [ "$status" -ge 400 ] && [ "$status" -lt 500 ]; then
              echo "::error::Cron request rejected with HTTP $status; check CRON_SECRET and the route."
              exit 1
            fi
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          echo "::warning::Cron request still failing (HTTP $status) after 3 attempts; skipping until next tick."
          exit 0
